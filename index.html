<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hedge Calculator - Liquidity Focus</title>
<style>
:root{
  --bg:#080d17;--card:#111a2b;--card2:#0a1220;--line:#1f2d44;
  --txt:#eef4fc;--mut:#7f93b0;--acc:#38bdf8;
  --good:#22c55e;--warn:#f59e0b;--bad:#ef4444;
}
*{box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{margin:0;background:radial-gradient(ellipse at top,#0f1a2e 0%,var(--bg) 60%);
color:var(--txt);padding:24px 16px;min-height:100vh}
.wrap{max-width:620px;margin:0 auto}
h1{font-size:1.3rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:.8rem;margin-bottom:22px;line-height:1.5}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
padding:20px;margin-bottom:16px}
.card h2{font-size:.72rem;margin:0 0 14px;color:var(--mut);
text-transform:uppercase;letter-spacing:.08em;font-weight:700}

.oddsRow{display:grid;grid-template-columns:1fr 44px 1fr;gap:12px;align-items:end;margin-bottom:16px}
.vs{display:flex;align-items:center;justify-content:center;padding-bottom:11px;
color:var(--mut);font-size:.72rem;font-weight:700}

label{display:flex;flex-direction:column;gap:6px;font-size:.65rem;
color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
input{background:var(--card2);border:1px solid var(--line);color:var(--txt);
padding:13px 14px;border-radius:11px;font-size:1.15rem;font-weight:600;
width:100%;text-align:center;transition:border-color .15s}
input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(56,189,248,.12)}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}

.btn{background:var(--mut);color:#000;border:none;padding:8px 12px;
border-radius:6px;font-weight:700;cursor:pointer;font-size:.7rem;
margin-top:6px;width:100%}
.btn:hover{background:#fff}

.scen{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media(max-width:520px){.scen{grid-template-columns:1fr}}
.sc{background:var(--card2);border-radius:10px;padding:13px 15px;font-size:.79rem;
border-left:3px solid var(--line)}
.sc.win{border-left-color:var(--good)}
.sc.lose{border-left-color:var(--bad)}
.sc .head{font-size:.64rem;color:var(--mut);text-transform:uppercase;
letter-spacing:.07em;font-weight:700;margin-bottom:9px}
.sc .line{display:flex;justify-content:space-between;padding:3px 0;color:var(--mut)}
.sc .line b{color:var(--txt);font-weight:600}
.sc .total{display:flex;justify-content:space-between;padding-top:8px;margin-top:6px;
border-top:1px solid var(--line);font-weight:800;color:var(--txt)}
.cash-box{margin-top:10px; padding:8px; background:rgba(56,189,248,.1); border-radius:6px; font-size:.75rem}
</style>
</head>
<body>
<div class="wrap">

  <h1>Liquidity Hedge Calculator</h1>
  <div class="sub">You can over-bet Side B to pull cash out of the platform, but you will lose money if Side A wins.</div>

  <div class="card">
    <h2>The Game</h2>

    <div class="oddsRow">
      <label>Side A odds (Affiliate)
        <input id="oA" type="number" step="0.01" min="1.01" value="2.01">
      </label>
      <div class="vs">VS</div>
      <label>Side B odds
        <input id="oB" type="number" step="0.01" min="1.01" value="2.01">
      </label>
    </div>

    <div class="grid2">
      <label>Money on Side A (₹)
        <input id="cap" type="number" min="0" step="500" value="10000">
      </label>
      <label>Affiliate Rev Share (%)
        <input id="rate" type="number" min="0" max="100" step="1" value="50">
      </label>
    </div>

    <div class="grid2" style="margin-top:12px">
      <label>Money on Side B (₹) — You can edit this
        <input id="stakeB" type="number" min="0" step="500" value="7512">
        <button class="btn" id="balanceBtn">Auto-Balance (Equal Profit)</button>
        <button class="btn" id="liquidityBtn">Max Cash on B (Break-even if A wins)</button>
      </label>
    </div>
  </div>

  <div id="out"></div>

</div>

<script>
const $ = id => document.getElementById(id);
const money = n => (n<0?'−₹':'₹') + Math.abs(Math.round(n)).toLocaleString('en-IN');

function autoBalance() {
  const oA = parseFloat($('oA').value);
  const oB = parseFloat($('oB').value);
  const L  = parseFloat($('cap').value) || 0;
  const r  = (parseFloat($('rate').value) || 0) / 100;
  if(oA>1 && oB>1 && L>0) {
    $('stakeB').value = Math.round(L * (oA - r) / oB);
    calc();
  }
}

function maxCash() {
  const oA = parseFloat($('oA').value);
  const oB = parseFloat($('oB').value);
  const L  = parseFloat($('cap').value) || 0;
  // To break even if A wins: W = L * (oA - 1)
  // This maximizes cash on B while ensuring you don't lose money if A wins.
  if(oA>1 && oB>1 && L>0) {
    $('stakeB').value = Math.round(L * (oA - 1));
    calc();
  }
}

function calc(){
  const oA = parseFloat($('oA').value);
  const oB = parseFloat($('oB').value);
  const L  = parseFloat($('cap').value) || 0;
  const r  = (parseFloat($('rate').value) || 0) / 100;
  const W  = parseFloat($('stakeB').value) || 0;
  const out = $('out');

  if(!(oA > 1.001 && oB > 1.001) || L <= 0 || W <= 0){
    out.innerHTML = `<div class="card"><div class="note">Enter valid odds and money.</div></div>`;
    return;
  }

  // Scenario 1: A loses (You get Rev Share)
  const pA_loses = W * (oB - 1) - L + (L * r);
  // Cash returned to Side B account if A loses
  const cashB_ifALoses = W * oB; 

  // Scenario 2: A wins (No Deduction)
  const pB_loses = L * (oA - 1) - W;
  // Cash returned to Side A account if A wins
  const cashA_ifB_loses = L * oA;

  const capital = L + W;
  const guaranteed = Math.min(pA_loses, pB_loses);
  const isBalanced = Math.abs(pA_loses - pB_loses) < 5;

  out.innerHTML = `
    <div class="card">
      <h2>Cash Flow & Outcomes</h2>
      <div class="scen">
        
        <div class="sc ${pA_loses >= 0 ? 'win' : 'lose'}">
          <div class="head">If Side A loses (B wins)</div>
          <div class="line"><span>B pays out</span><b>+${money(W*(oB-1))}</b></div>
          <div class="line"><span>Lose A's stake</span><b>−${money(L)}</b></div>
          <div class="line"><span>Rev Share Received</span><b>+${money(L*r)}</b></div>
          <div class="total"><span>Net Profit</span><span>${money(pA_loses)}</span></div>
          
          <div class="cash-box">
            💰 <b>Liquid Cash:</b> You get <b>${money(cashB_ifALoses)}</b> in your Side B account.
          </div>
        </div>

        <div class="sc ${pB_loses >= 0 ? 'win' : 'lose'}">
          <div class="head">If Side B loses (A wins)</div>
          <div class="line"><span>A pays out</span><b>+${money(L*(oA-1))}</b></div>
          <div class="line"><span>Lose B's stake</span><b>−${money(W)}</b></div>
          <div class="line"><span>No Deduction</span><b>₹0</b></div>
          <div class="total"><span>Net Profit</span><span>${money(pB_loses)}</span></div>
          
          <div class="cash-box" style="background:rgba(239,68,68,.1);">
            🔒 <b>Locked Cash:</b> You get <b>${money(cashA_ifB_loses)}</b> in Side A (requires withdrawal).
          </div>
        </div>

      </div>
      
      ${isBalanced 
        ? `<div class="note" style="color:var(--good); font-weight:bold; text-align:center; margin-top:12px;">✓ Balanced: Profits are exactly equal.</div>`
        : `<div class="note" style="color:var(--warn); font-weight:bold; text-align:center; margin-top:12px;">⚠ Unbalanced: You make ${money(Math.abs(pA_loses - pB_loses))} more if Side A ${pA_loses > pB_loses ? 'loses' : 'wins'}.</div>`
      }
    </div>
  `;
}

$('balanceBtn').addEventListener('click', autoBalance);
$('liquidityBtn').addEventListener('click', maxCash);

['oA','oB','cap','rate','stakeB'].forEach(id => {
  $(id).addEventListener('input', calc);
});

autoBalance();
</script>
</body>
</html>
